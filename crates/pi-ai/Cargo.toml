[package]
name = "pi-ai"
description = "Model-agnostic AI types, streaming protocol, and provider adapters (pi-rs port of packages/ai)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pi-telemetry = { workspace = true }

# "net" is only exercised by the integration tests' local mock SSE server.
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true }
# Vertex ADC: base64url JWT segments, RS256 service-account signing.
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
# Bedrock: SigV4 signing (HMAC-SHA256) and event-stream frame CRCs.
hmac = "0.12"
crc32fast = "1.4"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
