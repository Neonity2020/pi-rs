[package]
name = "pi-coding-agent"
description = "The pi coding agent, Rust port (binary: pi-rs) of packages/coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pi-rs"
path = "src/main.rs"

[dependencies]
pi-ai = { workspace = true }
pi-agent = { workspace = true }
pi-mcp = { workspace = true }
pi-env = { workspace = true }
pi-tui = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
# ripgrep's own walker: .gitignore/.ignore/global git excludes + binary skipping
# for the grep/find tools (upstream shells out to rg/fd; see tools/grep.rs).
ignore = "0.4"
# rg-compatible `--glob` matching (`*` crosses `/`), which the ignore crate's
# gitignore-style overrides do not provide.
globset = "0.4"
clap = { workspace = true }
dirs = { workspace = true }
unicode-width = { workspace = true }
dotenvy = "0.15"
# Session header ids: upstream uses uuidv7 (`createSessionId` in
# session-manager.ts); entry ids are 8-hex prefixes of random v4 UUIDs.
uuid = { version = "1", features = ["v4", "v7"] }
