[package]
name = "pi-coding-agent"
description = "The pi coding agent, Rust port (binary: pi-rs) of packages/coding-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pi-rs"
path = "src/main.rs"

[dependencies]
pi-ai = { workspace = true }
pi-agent = { workspace = true }
pi-extension-host = { path = "../pi-extension-host" }
pi-mcp = { workspace = true }
pi-env = { workspace = true }
pi-tui = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `oauth.callbackUrl`/`authServerMetadataUrl` validation in mcp_config.rs.
url = "2"
thiserror = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
# Skill/prompt-template frontmatter (`---\nYAML\n---` blocks; upstream parses
# with the `yaml` npm package in utils/frontmatter.ts).
serde_yaml = { workspace = true }
# ripgrep's own walker: .gitignore/.ignore/global git excludes + binary skipping
# for the grep/find tools (upstream shells out to rg/fd; see tools/grep.rs).
ignore = "0.4"
# rg-compatible `--glob` matching (`*` crosses `/`), which the ignore crate's
# gitignore-style overrides do not provide.
globset = "0.4"
# @file image attachments: decode/resize/re-encode for the inline image
# pipeline (upstream uses Photon WASM; image crate is the native stand-in).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
base64 = "0.22"
clap = { workspace = true }
dirs = { workspace = true }
unicode-width = { workspace = true }
dotenvy = "0.15"
# Session header ids: upstream uses uuidv7 (`createSessionId` in
# session-manager.ts); entry ids are 8-hex prefixes of random v4 UUIDs.
uuid = { version = "1", features = ["v4", "v7"] }
