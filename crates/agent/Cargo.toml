[package]
name = "pi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent loop for pi-rs: model requests, tool execution, event stream"

[lib]
name = "agent"

[dependencies]
pi-llm = { version = "0.2.1", path = "../llm" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros"] }
