name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      TERM: xterm-256color
      SHELL: /bin/bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust with checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: PTY smoke tests in an isolated working directory
        run: |
          pi_smoke_dir="$(mktemp -d)"
          cd "$pi_smoke_dir"
          python3 "$GITHUB_WORKSPACE/scripts/tui_smoke.py" "$pi_smoke_dir/home" "$GITHUB_WORKSPACE/target/debug/pi-rs"
          python3 "$GITHUB_WORKSPACE/scripts/tui_chat_smoke.py" "$pi_smoke_dir/chat-home" "$GITHUB_WORKSPACE/target/debug/pi-rs"
          python3 "$GITHUB_WORKSPACE/scripts/tui_model_smoke.py" "$pi_smoke_dir/model-home" "$GITHUB_WORKSPACE/target/debug/pi-rs"

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
