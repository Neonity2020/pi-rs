[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Neonity2020/pi-os"
description = "pi-rs: Rust port of the pi coding agent (https://pi.dev)"

[workspace.dependencies]
pi-telemetry = { path = "crates/pi-telemetry" }
pi-chord = { path = "crates/pi-chord" }
pi-codemode = { path = "crates/pi-codemode" }
pi-durable = { path = "crates/pi-durable" }
pi-ai = { path = "crates/pi-ai" }
pi-agent = { path = "crates/pi-agent" }
pi-mcp = { path = "crates/pi-mcp" }
pi-env = { path = "crates/pi-env" }
pi-tui = { path = "crates/pi-tui" }
pi-coding-agent = { path = "crates/pi-coding-agent" }

tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"sync",
	"time",
	"process",
	"io-util",
	"fs",
] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
regex = "1"
walkdir = "2"
clap = { version = "4", features = ["derive"] }
dirs = "6"

[profile.release]
lto = "thin"
